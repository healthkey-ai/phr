services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthkey
      POSTGRES_USER: healthkey
      POSTGRES_PASSWORD: dev_only_change_in_prod
    ports:
      # 5433 on the host: leaves any locally-installed Postgres on 5432 alone
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://healthkey:dev_only_change_in_prod@db:5432/healthkey
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db

volumes:
  postgres_data:
