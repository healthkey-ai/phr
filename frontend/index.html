<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B4A9D" />
    <title>HealthKey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark-mode bootstrap (cancerbot ui.v2 pattern). Runs before paint so
      // there is no flash of the wrong theme; follows the OS preference and
      // reacts to live changes by toggling `.dark` on <html>.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          document.documentElement.classList.toggle("dark", mq.matches);
        };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <script>
      // Brand before first paint. The palette lives in index.css keyed off this
      // attribute; applying it from React would land a frame late and flash the
      // default colours. Storage can throw (private browsing) — the default
      // brand is the right answer there, so swallow and move on.
      try {
        var b = localStorage.getItem("phr.brand");
        if (b) document.documentElement.setAttribute("data-brand", b);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100svh;background:#fafafa">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="animation:spin 1s linear infinite">
          <circle cx="12" cy="12" r="10" stroke="#0B4A9D" stroke-width="3" opacity=".2"></circle>
          <path d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" fill="#0B4A9D" opacity=".75"></path>
        </svg>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
