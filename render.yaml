# HealthKey — Render blueprint
#
# Four services + one database:
#   1. healthkey-redis       — Redis key-value store (Celery broker + cache)
#   2. healthkey-db          — Postgres 16 (primary operational database)
#   3. healthkey-backend     — Django web service (DRF API + admin + health)
#   4. healthkey-worker      — Celery worker (async jobs, lab extraction pipeline)
#   5. healthkey-frontend    — Vite static site (patient app UI)
#
# The worker service is in place from Phase 2a onward even though the Phase 2a
# feature set doesn't submit tasks yet. Having the broker + worker running
# lets Phase 2b (upload + extraction) land without a blueprint change — the
# infrastructure is already there, we just start calling `.delay()`.
#
# Env var layout:
#   - `healthkey-core-env` group holds the plain shared values (settings
#     module, DEBUG, JWT lifetimes, feature flags). Cross-service references
#     (fromDatabase, fromService) are NOT supported inside envVarGroups, so
#     DATABASE_URL / CELERY_BROKER_URL / CELERY_RESULT_BACKEND live inline on
#     each service that needs them. Keeping the duplication tight + small.

envVarGroups:
  - name: healthkey-core-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: SECRET_KEY
        generateValue: true    # Render generates a random value on first apply

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"

      # CORS origin for the frontend. Set in the Render dashboard after the
      # static site is first deployed (e.g. https://healthkey-frontend.onrender.com).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── JWT lifetimes (patient app auth) ──────────────────────────────────
      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"

      # ── Firebase Admin SDK (partner auth — shared with ht-phr) ───────────
      # Paste the service-account key JSON as a single-line value in the
      # Render dashboard. Never commit.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: "healthtree-test"
      - key: FIREBASE_SKIP_REVOCATION_CHECK
        value: "False"

      # ── LLM vendor (Phase 2c onward — lab upload extraction) ──────────────
      # LAB_UPLOAD_ENABLED stays "False" until the BAA with the active provider
      # is signed (see TODOS.md / docs/patient-app-lab-upload-design.md §14).
      # Flipping to "True" in the dashboard is the feature-flag rollout.
      - key: LAB_UPLOAD_ENABLED
        value: "False"
      - key: LAB_LLM_PROVIDER
        value: "claude"            # "claude" | "openai"
      - key: ANTHROPIC_API_KEY
        sync: false            # set in dashboard, never committed
      - key: OPENAI_API_KEY
        sync: false            # set in dashboard when LAB_LLM_PROVIDER=openai
      - key: LAB_OPENAI_MODEL
        value: "gpt-4o"

      # ── Shared file storage (§9.1 of lab upload design doc) ──────────────
      # Web + worker services live in separate containers so the local
      # filesystem isn't shared. Uploads route to object storage so the
      # worker can read what the web process wrote.
      #
      # Precedence: if GS_BUCKET_NAME is set, GCS is used. Else if
      # AWS_STORAGE_BUCKET_NAME is set, S3 is used. Else FileSystemStorage
      # (dev only). Pick one — setting both just ignores S3.

      # Google Cloud Storage ────────────────────────────────────────────────
      - key: GS_BUCKET_NAME
        sync: false
      - key: GS_PROJECT_ID
        sync: false
      # Paste the full service-account key JSON as the value here (single
      # line or multi-line both work in the Render dashboard). Never commit.
      - key: GS_CREDENTIALS_JSON
        sync: false

      # S3-compatible (AWS, R2, B2) ─────────────────────────────────────────
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: "us-east-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Leave blank for AWS S3. Set to "https://<account>.r2.cloudflarestorage.com"
      # for R2, etc. when using an S3-compatible non-AWS backend.
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_ENCRYPTION
        value: "AES256"     # bump to "aws:kms" once a KMS key is provisioned

services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Redis (Render Key Value) — Celery broker + result backend
  # ─────────────────────────────────────────────────────────────────────────
  - type: keyvalue
    name: healthkey-redis
    plan: free               # free tier has 25MB — enough for Phase 2a/b volume
    ipAllowList: []          # internal-only (services in this blueprint)

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Django web service (DRF API + admin + health checks)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: healthkey-backend
    runtime: docker
    plan: starter            # 512MB / 0.5 CPU; bump to standard for prod load

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Runs once per deploy before traffic is routed. Migrates the DB, loads
    # the lab catalog fixture, collects static files. Idempotent, so replays
    # on redeploy are safe.
    preDeployCommand: ./scripts/pre-deploy.sh

    healthCheckPath: /health-check/

    envVars:
      - fromGroup: healthkey-core-env

      # ── Cross-service refs (must live inline; not allowed in groups) ──
      - key: DATABASE_URL
        fromDatabase:
          name: healthkey-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: healthkey-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: healthkey-redis
          property: connectionString

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Celery worker service (async jobs — Phase 2b+ lab extraction pipeline)
  # ─────────────────────────────────────────────────────────────────────────
  # Boots even in Phase 2a (no tasks yet) so the broker + worker wiring is
  # verified before Phase 2b introduces real tasks. `config.celery` auto-
  # discovers any app's `tasks.py`, so new tasks ship without a blueprint
  # change.
  - type: worker
    name: healthkey-worker
    runtime: docker
    plan: starter

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Override the Dockerfile's gunicorn CMD to run the Celery worker.
    # --concurrency=2 matches the starter plan's 0.5 CPU — spinning up more
    # workers than the box can run just thrashes. Bump with the plan.
    dockerCommand: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
      --without-gossip
      --without-mingle

    envVars:
      - fromGroup: healthkey-core-env

      # ── Cross-service refs (same as backend; the worker needs the same
      # database + broker as the web process) ─────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: healthkey-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: healthkey-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: healthkey-redis
          property: connectionString

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Vite frontend (static site)
  #
  #    Builds both the main patient app and the federation remote bundle.
  #    Main app lives at /*, remote entry at /remote/remoteEntry.js.
  #    The /remote/* path has CORS headers so host apps (ht-phr) can load
  #    federated modules cross-origin.
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: healthkey-frontend
    runtime: static

    rootDir: ./frontend
    buildCommand: npm ci && npm run build && npm run build:remote
    staticPublishPath: ./dist

    headers:
      - path: /remote/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /remote/*
        name: Access-Control-Allow-Methods
        value: GET
      - path: /remote/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /remote/remoteEntry.js
        name: Cache-Control
        value: no-cache

    routes:
      # Falls back to index.html for React Router client-side routing.
      # Static files (including /remote/remoteEntry.js) are served directly
      # before this rewrite applies.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # The Vite build inlines import.meta.env.VITE_API_URL into the bundle.
      # Set this in the Render dashboard to the backend's public hostname
      # after first deploy — e.g. https://healthkey-backend.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false

databases:
  - name: healthkey-db
    plan: basic-256mb          # ~256MB storage, ample for Phase 2a
    postgresMajorVersion: "16"
    databaseName: healthkey
    # The Postgres service emits a `connectionString` property that Django
    # consumes via env.db("DATABASE_URL") on the backend.
