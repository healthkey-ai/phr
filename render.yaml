# HealthKey PHR portal — Render blueprint
#
# Two services + one database:
#   1. healthkey-db          — Postgres 16 (user accounts + patient profiles;
#                              THE identity database for the HealthKey family)
#   2. healthkey-backend     — Django web service (DRF API + admin + health)
#   3. healthkey-frontend    — Vite static site (portal UI)
#
# phr is the identity provider: sibling services (hk-labs, fhir importers, …)
# verify phr-issued RS256 JWTs offline via GET /api/v1/auth/jwks/, or call
# POST /api/v1/auth/introspect/ for revocation-aware checks. Set the
# JWT_PRIVATE_KEY / JWT_PUBLIC_KEY PEM pair in the dashboard to enable RS256.
#
# Env var layout: the `healthkey-core-env` group holds plain shared values.
# Cross-service references (fromDatabase) are NOT supported inside
# envVarGroups, so DATABASE_URL lives inline on the backend service.

envVarGroups:
  - name: healthkey-core-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: SECRET_KEY
        generateValue: true    # Render generates a random value on first apply

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"

      # CORS origin for the frontend. Set in the Render dashboard after the
      # static site is first deployed (e.g. https://healthkey-frontend.onrender.com).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── JWT (phr is the token issuer for the service family) ─────────────
      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"
      - key: JWT_ISSUER
        value: "healthkey-phr"
      # RSA keypair (PEM). Set both in the dashboard; never commit. With these
      # set, tokens are RS256 and siblings verify via /api/v1/auth/jwks/.
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Django web service (DRF API + admin + health checks)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: healthkey-backend
    runtime: docker
    plan: starter            # 512MB / 0.5 CPU; bump to standard for prod load

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Runs once per deploy before traffic is routed. Migrates the DB and
    # collects static files. Idempotent, so replays on redeploy are safe.
    preDeployCommand: ./scripts/pre-deploy.sh

    healthCheckPath: /health-check/

    envVars:
      - fromGroup: healthkey-core-env

      # Cross-service ref (must live inline; not allowed in groups)
      - key: DATABASE_URL
        fromDatabase:
          name: healthkey-db
          property: connectionString

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Vite frontend (static site)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: healthkey-frontend
    runtime: static

    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # Routes fall back to index.html so React Router handles them client-side.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # The Vite build inlines import.meta.env.VITE_API_URL into the bundle.
      # Set this in the Render dashboard to the backend's public hostname
      # after first deploy — e.g. https://healthkey-backend.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false

databases:
  - name: healthkey-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: healthkey
    # The Postgres service emits a `connectionString` property that Django
    # consumes via env.db("DATABASE_URL") on the backend.
